<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phase 4A Visual QA Viewer</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1a1a1a;
            color: #eee;
        }
        #canvas-container {
            width: 100vw;
            height: 100vh;
            display: block;
        }
        #ui-panel {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 300px;
            background: rgba(30, 30, 30, 0.9);
            border: 1px solid #444;
            border-radius: 8px;
            padding: 15px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            max-height: 90vh;
            overflow-y: auto;
        }
        #selection-panel {
            position: absolute;
            bottom: 20px;
            left: 20px;
            background: rgba(30, 30, 30, 0.9);
            border: 1px solid #444;
            border-radius: 8px;
            padding: 15px;
            min-width: 250px;
            display: none;
        }
        h3 {
            margin-top: 0;
            margin-bottom: 10px;
            font-size: 16px;
            color: #fff;
            border-bottom: 1px solid #444;
            padding-bottom: 5px;
        }
        .control-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-size: 14px;
            cursor: pointer;
        }
        input[type="checkbox"] {
            margin-right: 8px;
        }
        .layer-item {
            margin-left: 10px;
        }
        .prop-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 4px;
            font-size: 13px;
        }
        .prop-label {
            color: #aaa;
        }
        .prop-value {
            color: #4da6ff;
            font-weight: bold;
        }
        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 24px;
            font-weight: bold;
            color: #fff;
        }
    </style>
</head>
<body>
    <div id="loading">Loading RenderSceneDTO...</div>
    <div id="canvas-container"></div>
    
    <div id="ui-panel">
        <h3>QA Controls</h3>
        
        <div class="control-group">
            <label><input type="checkbox" id="toggle-wireframe"> Global Wireframe</label>
            <label><input type="checkbox" id="toggle-grid" checked> Grid Helper</label>
            <label><input type="checkbox" id="toggle-axis" checked> Axis Helper</label>
            <label><input type="checkbox" id="toggle-labels" checked> Show Labels</label>
        </div>

        <h3>Layers</h3>
        <div class="control-group" id="layers-container">
            <!-- Populated dynamically -->
        </div>
    </div>

    <div id="selection-panel">
        <h3>Selection Info</h3>
        <div id="selection-content"></div>
    </div>

    <!-- Three.js Dependencies -->
    <script async src="https://unpkg.com/es-module-shims@1.6.3/dist/es-module-shims.js"></script>
    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.158.0/build/three.module.js",
          "three/addons/": "https://unpkg.com/three@0.158.0/examples/jsm/"
        }
      }
    </script>
    <script type="module">
        let scriptPath = './viewer.js';
        if (window.location.pathname.endsWith('/qa-viewer')) {
            scriptPath = './qa-viewer/viewer.js';
        }
        console.log('[QA-Viewer] Resolved script path:', scriptPath);
        
        import(scriptPath).catch(err => {
            console.error('[QA-Viewer] Failed to load script:', err);
            const loadingEl = document.getElementById('loading');
            if (loadingEl) {
                loadingEl.innerHTML = `Error loading viewer.js.<br>Attempted path: ${scriptPath}<br>Error: ${err.message}`;
                loadingEl.style.color = '#ff4da6';
            }
        });
    </script>
</body>
</html>
